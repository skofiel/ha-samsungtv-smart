name: "Release"

on:
  release:
    types:
      - "published"

permissions:
  contents: write

jobs:
  verify:
    name: "Run the test suite before publishing"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component requires 3.13.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: pytest
        run: pytest tests -q

  detect-branch:
    name: "Detect target branch from release type"
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.detect.outputs.branch }}
    steps:
      - name: "Determine target branch"
        id: detect
        run: |
          # Stable releases target master.
          # Pre-releases (betas, rc) target the dev branch matching their
          # version line: 8.0.x -> v8-json-rpc, 8.1.x -> v8.1-dev, etc.
          # The branch is derived from the tag's major.minor so new dev
          # lines (8.2, ...) keep working without editing this workflow,
          # as long as the branch is named v<major>.<minor>-dev.
          TAG="${{ github.event.release.tag_name }}"
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          if [[ "$IS_PRERELEASE" != "true" ]]; then
            BRANCH="master"
          elif [[ "$TAG" =~ ^8\.0\.0 ]]; then
            # The 8.0 line predates the v<maj>.<min>-dev convention.
            BRANCH="v8-json-rpc"
          elif [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            BRANCH="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-dev"
          else
            echo "::error::Cannot derive a dev branch from tag '$TAG'"
            exit 1
          fi
          echo "Release tag: $TAG (prerelease=$IS_PRERELEASE) -> target branch: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  update-manifest:
    name: "Update manifest version"
    runs-on: ubuntu-latest
    needs: detect-branch
    steps:
      - name: "Checkout target branch"
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ needs.detect-branch.outputs.target_branch }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Refuse a version that goes backwards"
        # 8.9.13 was published and then 8.8.13 the same day. HACS orders
        # releases by version, so everyone who had taken 8.9.13 stopped being
        # offered any update at all. Fail loudly instead of stranding them.
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CURRENT=$(jq -r '.version' custom_components/samsungtv_smart/manifest.json)
          HIGHEST=$(printf '%s\n%s\n' "$TAG" "$CURRENT" | sort -V | tail -1)
          if [ "$TAG" != "$CURRENT" ] && [ "$HIGHEST" != "$TAG" ]; then
            echo "::error::Release tag $TAG is lower than the version already on"\
                 "${{ needs.detect-branch.outputs.target_branch }} ($CURRENT)."\
                 "Delete this release and tag a version above $CURRENT."
            exit 1
          fi
          echo "Tag $TAG is not a regression on $CURRENT."

      - name: "Update manifest.json"
        run: |
          jq '.version = "${{ github.event.release.tag_name }}"' \
            custom_components/samsungtv_smart/manifest.json > tmp.json
          mv tmp.json custom_components/samsungtv_smart/manifest.json
      - name: "Commit, push, and move the tag onto the bump"
        # Publishing a release creates its tag at whatever the branch head was,
        # which is the commit *before* this bump — so the tag's tree carried the
        # PREVIOUS version in manifest.json. HACS names the install after the
        # tag while Home Assistant reads the manifest, so every release showed
        # up as two different versions in the two places (HACS "8.10.2", HA
        # "8.10.1").
        #
        # The tag is seconds old and nothing has fetched it yet, so moving it
        # onto the bump commit is safe and makes the two agree. The release
        # keeps pointing at the same tag name, now with the right tree.
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/samsungtv_smart/manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json already reads $TAG; leaving the tag where it is."
            exit 0
          fi
          git commit -m "chore: bump manifest version to $TAG"
          git push origin refs/heads/${{ needs.detect-branch.outputs.target_branch }}
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          echo "Tag $TAG now points at the commit that sets manifest version $TAG."

  release:
    name: "Release"
    runs-on: ubuntu-latest
    needs: [detect-branch, update-manifest]
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ needs.detect-branch.outputs.target_branch }}
      - name: "Set manifest version from tag (authoritative)"
        # Force the version inside the artifact to match the release tag,
        # independent of the update-manifest push having propagated.
        # This is what makes the zip's version reliably correct.
        run: |
          jq '.version = "${{ github.event.release.tag_name }}"' \
            custom_components/samsungtv_smart/manifest.json > tmp.json
          mv tmp.json custom_components/samsungtv_smart/manifest.json
          echo "manifest version is now:"
          jq -r '.version' custom_components/samsungtv_smart/manifest.json
      - name: "ZIP the integration directory"
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/samsungtv_smart"
          zip samsungtv_smart.zip -r ./
      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: ${{ github.workspace }}/custom_components/samsungtv_smart/samsungtv_smart.zip
