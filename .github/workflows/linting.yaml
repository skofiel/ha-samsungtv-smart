name: Linting

on:
  push:
    branches:
      - master
      - v8-json-rpc
  pull_request:
    branches: ["*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      # Every check below covers tests/ as well as the integration: a test
      # module that does not import is a test that never runs, and the suite
      # used to abort collection for exactly that reason with nothing flagging
      # it.
      #
      # .ruff.toml and scripts/lint shipped with the repository and no workflow
      # ever ran either, so its rules had never once been applied.
      - name: ruff
        run: ruff check custom_components tests
      - name: flake8
        run: flake8 custom_components tests
      - name: isort
        run: isort --diff --check custom_components tests
      - name: Black
        run: black --line-length 88 --diff --check custom_components tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
