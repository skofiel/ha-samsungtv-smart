# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
#
# Home Assistant 2025.6 requires Python 3.13, which is also what the Tests and
# Linting workflows run, so that is the target here too. It was "py310", which
# held back the pyupgrade rewrites below.
target-version = "py313"

[lint]
# These used to sit at the top level of this file, where current ruff only
# honours them with a deprecation warning on every run.
select = [
    "B007", # Loop control variable {name} not used within loop body
    "B014", # Exception handler with duplicate exception
    "C",  # complexity
    "D",  # docstrings
    "E",  # pycodestyle
    "F",  # pyflakes/autoflake
    "ICN001", # import concentions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "SIM105", # Use contextlib.suppress({exception}) instead of try-except-pass
    "SIM117", # Merge with-statements that use the same scope
    "SIM118", # Use {key} in {dict} instead of {key} in {dict}.keys()
    "SIM201", # Use {left} != {right} instead of not {left} == {right}
    "SIM212", # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
    "SIM300", # Yoda conditions. Use 'age == 42' instead of '42 == age'.
    "SIM401", # Use get from dict with default instead of an if block
    "T20",  # flake8-print
    "TRY004", # Prefer TypeError exception for invalid type
    "RUF006", # Store a reference to the return value of asyncio.create_task
    "UP",  # pyupgrade
    "W",  # pycodestyle
]

ignore = [
    "D202",  # No blank lines allowed after function docstring
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "D404",  # First word of the docstring should not be This
    "D406",  # Section name should end with a newline
    "D407",  # Section name underlining
    "D411",  # Missing blank line before section
    "E501",  # line too long
    "E731",  # do not assign a lambda expression, use a def

    # --- Staged debt -----------------------------------------------------
    # This config shipped with the repository and no workflow ever ran it, so
    # its rules had never been applied. Everything else it flags is now fixed
    # and ruff runs in CI; these 111 findings are all docstring style, and the
    # honest way to clear them is one module at a time by someone who can say
    # what each function does. Writing a hundred filler docstrings to turn a
    # linter green makes the code worse. Delete entries from this block as
    # modules are cleaned up.
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D205",  # 1 blank line required between summary line and description
    "D400",  # First line should end with a period
    "D401",  # First line of docstring should be in imperative mood
    "D415",  # First line should end with a period, question mark, or point
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# Test functions carry their intent in the name (and usually a docstring where
# the name is not enough); requiring one on every single case adds noise
# without adding meaning.
"tests/**" = ["D103"]
